<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Unicorn | Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff; /* fond blanc */
      overflow: hidden;
    }

    .splash-container {
      text-align: center;
      animation: fadeIn 1.5s ease-in-out;
    }

    /* ==== Effet de lumière pour World Unicorn ==== */
    h1 {
      font-size: 3rem;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 0.6rem;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
      position: relative;
      display: inline-block;
      overflow: hidden;
      background: linear-gradient(90deg, #ffffff 0%, #b3b3b3 20%, #ffffff 40%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: lightSweep 3s linear infinite;
    }

    @keyframes lightSweep {
      0% {
        background-position: -200% center;
      }
      100% {
        background-position: 200% center;
      }
    }

    /* Texte secondaire */
    p {
      font-size: 1.1rem;
      color: #ffffff;
      letter-spacing: 1px;
      margin-bottom: 2rem;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
      animation: fadeInText 2s ease-in forwards;
    }

    /* Barre de chargement */
    .progress-bar {
      position: relative;
      width: 300px;
      height: 8px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      margin: 0 auto;
      overflow: hidden;
    }

    .progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #bf88f7, #e100ff); /* bleu/violet */
      border-radius: 10px;
      animation: loadProgress 7s ease-in-out forwards;
    }

    @keyframes loadProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInText {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <h1>World Unicorn</h1>
    <p>Smarter. Faster. Automated. The New Era of Deriv Trading.</p>
    <div class="progress-bar"><div class="progress"></div></div>
  </div>

  <script>
    // Redirection après le chargement
    setTimeout(() => {
      window.location.href = "login.html"; // 👉 change ici ton fichier de destination
    }, 7500);
  </script>
</body>
</html>
